<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190"
     role="img" aria-label="Research loop from observation to robot feedback">
  <title>Research loop from observation to robot feedback</title>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#34D399"/>
    </marker>
  </defs>
  <rect width="1200" height="190" rx="16" fill="#E5E7EB"/>
  <path d="M178 95H1022" stroke="#0B1220" stroke-opacity=".22" stroke-width="2"/>
  <path d="M290 95H322M590 95H622M890 95H922" stroke="#34D399" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1060 129 C1028 179 170 179 140 129 C121 98 143 71 172 58" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <g fill="#0B1220" stroke="#34D399" stroke-width="3">
    <circle cx="160" cy="95" r="18"/><circle cx="460" cy="95" r="18"/>
    <circle cx="760" cy="95" r="18"/><circle cx="1060" cy="95" r="18"/>
  </g>
  <g fill="#0B1220" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">
    <text x="160" y="52">VISION + LANGUAGE</text>
    <text x="460" y="52">VLA + WORLD MODEL</text>
    <text x="760" y="52">SONIC × BXI</text>
    <text x="1060" y="52">SIM2REAL</text>
  </g>
  <g fill="#0B1220" fill-opacity=".62" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    <text x="160" y="140">observe</text><text x="460" y="140">predict</text>
    <text x="760" y="140">act</text><text x="1060" y="140">evaluate</text>
  </g>
  <text x="600" y="178" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">RETURN FEEDBACK · CLOSE THE LOOP</text>
</svg>
